# Test-only settings. Used when a test starts the application with @ActiveProfiles("test").
# The values below are NOT real secrets: they only let the tests start the application.
# The tests use an in-memory H2 database in MySQL mode, so no MySQL server and no Docker are needed.

# The driver and dialect are set here on purpose. A MySQL driver or dialect in the main
# application.properties would otherwise be used, and H2 cannot work with it.
spring.datasource.url=jdbc:h2:mem:medcore_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# The MySQL migration scripts cannot run on H2, so the tests build the tables with Hibernate instead.
spring.flyway.enabled=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.jwt.secret=test-only-secret-key-that-is-long-enough-for-hs256
app.jwt.expiration-minutes=60

# ApiSmokeTests logs in with exactly these two values. Keep them in step with that file.
app.superadmin.username=testadmin
app.superadmin.password=test-admin-password

app.otp.mode=log
app.schedule.open=09:00
app.schedule.close=17:00
app.schedule.slot-minutes=15

spring.data.web.pageable.max-page-size=100
server.error.include-message=never
server.error.include-stacktrace=never
